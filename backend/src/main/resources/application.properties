server.port=${PORT:8080}
spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3307/skillbridge?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DATABASE_USERNAME:skillbridge}
spring.datasource.password=${DATABASE_PASSWORD:skillbridge}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jackson.serialization.write-dates-as-timestamps=false
skillbridge.jwt.secret=${SKILLBRIDGE_JWT_SECRET}
skillbridge.jwt.expiration-hours=${JWT_EXPIRATION_HOURS:24}
skillbridge.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,https://localhost,capacitor://localhost,skillbridge://localhost}
skillbridge.auth.email-verification-required=${EMAIL_VERIFICATION_REQUIRED:false}
skillbridge.auth.demo-otp-recipient=${DEMO_OTP_RECIPIENT:}
skillbridge.frontend-url=${FRONTEND_URL:http://localhost:5173}
skillbridge.ai.base-url=${AI_BASE_URL:}
skillbridge.ai.api-key=${AI_API_KEY:}
skillbridge.ai.model=${AI_MODEL:}
skillbridge.ai.timeout-seconds=${AI_TIMEOUT_SECONDS:30}
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}
skillbridge.mail.from=${MAIL_FROM:noreply@skillbridge.local}
skillbridge.demo.seed-enabled=${SKILLBRIDGE_DEMO_SEED_ENABLED:false}
