services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: skillbridge
      MYSQL_USER: ${DATABASE_USERNAME:-skillbridge}
      MYSQL_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in backend/.env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in backend/.env}
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - skillbridge-mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  skillbridge-mysql:
